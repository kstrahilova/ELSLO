apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-controller-files
data:
  main.go: |-
    {{- .Files.Get "app/main.go" | nindent 4 }}
  go.mod: |-
    {{- .Files.Get "app/go.mod" | nindent 4 }}
  go.sum: |-
    {{- .Files.Get "app/go.sum" | nindent 4 }}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: controller-files
data:
  ingressroute_controller.go: |-
    {{- .Files.Get "app/controller/ingressroute_controller.go" | nindent 4 }}
  
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: types-files
data:
  weighted_replicas.go: |-
    {{- .Files.Get "app/types/weighted_replicas.go" | nindent 4 }}
  config.go: |-
    {{- .Files.Get "app/types/config.go" | nindent 4 }}
  metrics.go: |-
    {{- .Files.Get "app/types/metrics.go" | nindent 4 }}
  prometheus_histogram.go: |-
    {{- .Files.Get "app/types/prometheus_histogram.go" | nindent 4 }}

---

apiVersion: v1
